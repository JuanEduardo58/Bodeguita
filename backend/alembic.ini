[alembic]
# Ruta donde están las migraciones (¡la línea que te daba el error!)
script_location = alembic

# Agrega la carpeta actual al path de Python para que detecte la carpeta "app"
prepend_sys_path = .

# Formato del nombre de los archivos que se van a generar
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# URL de conexión base (aunque env.py toma la del .env, es bueno tenerla aquí de respaldo)
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/sistema_colmados

# --- Configuración de Logs (para que veas en consola lo que hace Alembic) ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S